[project]
name = "datagen"
version = "0.1.0"
description = "Deterministic synthetic e-commerce data generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "pyarrow>=18.0",
    # Windows ships no IANA time zone database; pyarrow needs one to read tz-aware timestamps.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
datagen = "datagen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]
