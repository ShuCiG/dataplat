version: "3"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install dev dependencies and git hooks
    cmds:
      - uv sync
      - uv run pre-commit install

  lint:
    desc: Run all linters and formatters
    cmds:
      - uv run pre-commit run --all-files --show-diff-on-failure
