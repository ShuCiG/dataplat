version: "3"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install dev dependencies and git hooks
    cmds:
      - uv sync
      - uv run pre-commit install

  lint:
    desc: Run all linters and formatters
    cmds:
      - uv run pre-commit run --all-files --show-diff-on-failure

  test:
    desc: Run unit tests
    cmds:
      - uv run pytest

  datagen:
    desc: "Generate landing data locally, e.g. task datagen -- --date 2025-03-15 --days 3"
    cmds:
      - uv run datagen generate {{.CLI_ARGS}}

  datagen:upload:
    desc: "Upload generated data, e.g. task datagen:upload -- --date 2025-03-15 --bucket <bucket>"
    cmds:
      - uv run datagen upload {{.CLI_ARGS}}

  airflow:up:
    desc: Start local Airflow (needs airflow/.env, see airflow/.env.example), UI on localhost:8080
    dir: airflow
    cmds:
      - docker compose up -d --build

  airflow:down:
    desc: Stop local Airflow (keeps its metadata database)
    dir: airflow
    cmds:
      - docker compose down

  airflow:test:
    desc: Run the DAG tests inside the Airflow image
    dir: airflow
    cmds:
      - docker compose build airflow-init
      - docker compose run --rm --no-deps --entrypoint python airflow-init -m pytest /opt/airflow/tests -q

  destroy:
    desc: "Dry run of tearing down one environment, e.g. task destroy -- dev. Add --execute to really delete."
    cmds:
      - uv run python tools/teardown/teardown.py {{.CLI_ARGS}}
