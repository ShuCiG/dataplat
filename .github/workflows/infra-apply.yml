name: infra-apply

# The same commit is promoted dev -> tst -> stg -> prd. An environment starts only after the
# previous one has been applied and verified (see infra-deploy-env). Manual approval is a setting
# of the GitHub environment itself (stg and prd), not of this file.
on:
  push:
    branches: [main]
    paths:
      - infra/stacks/**
      - infra/modules/**
      - infra/envs/**
      - tools/verify/**
      - .github/workflows/infra-apply.yml
      - .github/workflows/infra-deploy-env.yml
      - .github/actions/snowflake-token/**
  workflow_dispatch:

permissions:
  contents: read

# Never run two rollouts at once, and never cancel one midway.
concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/infra-deploy-env.yml
    with:
      environment: dev
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  tst:
    needs: dev
    uses: ./.github/workflows/infra-deploy-env.yml
    with:
      environment: tst
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  stg:
    needs: tst
    uses: ./.github/workflows/infra-deploy-env.yml
    with:
      environment: stg
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  prd:
    needs: stg
    uses: ./.github/workflows/infra-deploy-env.yml
    with:
      environment: prd
    secrets: inherit
    permissions:
      contents: read
      id-token: write
