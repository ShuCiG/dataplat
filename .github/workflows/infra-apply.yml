name: infra-apply

on:
  push:
    branches: [main]
    paths:
      - infra/live/**
      - infra/modules/**
      - .github/workflows/infra-apply.yml
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same environment at once, and never cancel one midway.
concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply (${{ matrix.environment }} / ${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - environment: dev
            stack: 10-platform
    defaults:
      run:
        working-directory: infra/live/${{ matrix.environment }}/${{ matrix.stack }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Init
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        run: terraform apply -no-color tfplan
