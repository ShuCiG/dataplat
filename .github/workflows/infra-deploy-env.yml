name: infra-deploy-env

# One environment, start to finish: apply every stack, then prove the result. The caller
# (infra-apply) only moves on to the next environment when this workflow succeeds.
on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy (dev, tst, stg, prd).
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy and verify (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # One job per environment, so the environment's approval gate is asked for once.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC
      ENVIRONMENT: ${{ inputs.environment }}
      BACKEND: >-
        -backend-config=bucket=${{ vars.TF_STATE_BUCKET }}
        -backend-config=region=${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # --- 10-platform ------------------------------------------------------------------------
      - name: 10-platform / init
        working-directory: infra/stacks/10-platform
        run: terraform init $BACKEND -backend-config="key=$ENVIRONMENT/10-platform/terraform.tfstate"

      - name: 10-platform / plan
        working-directory: infra/stacks/10-platform
        run: terraform plan -no-color -var-file="../../envs/$ENVIRONMENT.tfvars" -out=tfplan

      - name: 10-platform / apply
        working-directory: infra/stacks/10-platform
        run: terraform apply -no-color tfplan

      # --- 20-warehouse -----------------------------------------------------------------------
      - name: 20-warehouse / init
        working-directory: infra/stacks/20-warehouse
        run: terraform init $BACKEND -backend-config="key=$ENVIRONMENT/20-warehouse/terraform.tfstate"

      - uses: ./.github/actions/snowflake-token
        with:
          environment: ${{ inputs.environment }}

      - name: 20-warehouse / plan
        working-directory: infra/stacks/20-warehouse
        run: terraform plan -no-color -var-file="../../envs/$ENVIRONMENT.tfvars" -out=tfplan

      - uses: ./.github/actions/snowflake-token
        with:
          environment: ${{ inputs.environment }}

      - name: 20-warehouse / apply
        working-directory: infra/stacks/20-warehouse
        run: terraform apply -no-color tfplan

      # --- verify: the gate to the next environment -------------------------------------------
      # Exit code 2 means the plan still wants changes, i.e. the apply did not converge.
      - name: Verify / 10-platform has converged
        working-directory: infra/stacks/10-platform
        run: terraform plan -no-color -detailed-exitcode -var-file="../../envs/$ENVIRONMENT.tfvars"

      - uses: ./.github/actions/snowflake-token
        with:
          environment: ${{ inputs.environment }}

      - name: Verify / 20-warehouse has converged
        working-directory: infra/stacks/20-warehouse
        run: terraform plan -no-color -detailed-exitcode -var-file="../../envs/$ENVIRONMENT.tfvars"

      - uses: ./.github/actions/snowflake-token
        with:
          environment: ${{ inputs.environment }}

      - name: Verify / access model and landing stage
        run: >-
          uv run --no-project --with snowflake-connector-python==5.2.0
          python tools/verify/verify_warehouse.py "$ENVIRONMENT"
